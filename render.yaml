services:
  - type: web
    name: imoveis-app
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_ENV
        value: sandbox
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
